name: Reminders and sync

on:
  schedule:
    - cron: "*/5 * * * *"    # reminders + portal sync (GitHub can run a few minutes late)
    - cron: "7,37 * * * *"   # notes for new recordings, twice an hour
  workflow_dispatch: {}

jobs:
  tick:
    if: github.event.schedule != '7,37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync portal and send due reminders
        run: |
          curl -fsS -m 120 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron"

  notes:
    if: github.event.schedule == '7,37 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Write notes for one new recording (1-3 min)
        run: |
          curl -sS -m 310 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/notes"
